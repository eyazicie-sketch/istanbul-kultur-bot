name: Günlük İstanbul Kültür Sanat Raporu

on:
  schedule:
    # Her gün sabah saat 08:00'de (UTC) otomatik çalışır (TSİ 11:00)
    - cron: '0 8 * * *'
  workflow_dispatch: # İstediğin zaman elle test edebilmen için

jobs:
  gunluk-rapor:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: pip install google-generativeai requests

      - name: Ajanı Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
